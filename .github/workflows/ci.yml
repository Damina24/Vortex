name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web (Next.js) — typecheck, lint, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Generate Prisma client
        working-directory: apps/web
        run: npx prisma generate

      - name: Typecheck
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Unit tests
        working-directory: apps/web
        run: npm test

      - name: Production build
        working-directory: apps/web
        run: npm run build

  ai-service:
    name: AI service (FastAPI) — tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pin Python 3.12: the pinned pydantic-core (pydantic==2.7.4) supports up
      # to CPython 3.12. Newer interpreters would try to build it from source.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: apps/ai-service
        run: pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: apps/ai-service
        run: pytest